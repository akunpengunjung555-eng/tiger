<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dragon Animal Fortune — MAX WIN</title>
<style>
:root{
  --gold:#ffd34d;--gold2:#ff9b16;--red:#8f071a;--red2:#35040d;
  --panel:#560713;--purple:#64107c;--green:#2fe36b;--cyan:#29e8ff;
  --ink:#fff9df;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 50% 10%,#a31b38 0,#560914 38%,#190208 82%,#050106 100%);
font-family:Arial,Helvetica,sans-serif;color:#fff}
body{display:flex;justify-content:center;padding:10px;overflow-x:hidden}
button{font:inherit}
.game{width:min(1180px,100%);position:relative}
.top{
  display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;align-items:end;margin-bottom:8px
}
.jack{
  min-height:58px;padding:4px 8px;text-align:center;border:3px solid var(--gold2);
  border-radius:18px 18px 8px 8px;background:linear-gradient(#8d1021,#480611);
  box-shadow:inset 0 0 16px #ffed8430,0 0 14px #ffad002e
}
.jack b{display:block;font-size:12px;color:#fff}.jack strong{font-size:20px;color:#ffe36a;text-shadow:0 2px #672400}
.pot{
  min-height:78px;border:4px solid var(--gold);border-radius:50% 50% 34% 34%;
  background:radial-gradient(circle at 50% 20%,#fff09b 0,#d18416 20%,#741d09 57%,#2a0509 100%);
  display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;
  box-shadow:0 0 24px #ffb0006e
}
.pot:before{content:"";position:absolute;inset:8px;border:2px solid #ffe36a;border-radius:50%;opacity:.5}
.pot .crown{font-size:27px;z-index:1}.pot b{z-index:1;color:#ffe96b;font-size:14px}
.info{
  display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px
}
.chipbox,.freebox,.betbox{
  border:2px solid #d98a1b;border-radius:9px;background:linear-gradient(#6d0c19,#39040b);
  padding:8px 11px;box-shadow:inset 0 0 12px #ffbd3620
}
.chipbox strong{color:#ffe26a;font-size:18px}.freebox strong{color:#6dff9a}.betbox strong{color:#fff}
.cabinet{
  position:relative;border:7px solid #d78918;border-radius:18px 18px 9px 9px;
  background:linear-gradient(#760b19,#3d050d);padding:9px;box-shadow:0 0 0 2px #ffe47a inset,0 0 35px #ffae0038
}
.screen{
  position:relative;border:5px solid #ffca3a;border-radius:12px;padding:8px;overflow:hidden;
  background:radial-gradient(circle at 50% 0,#b82738,#690918 48%,#33030a);
  box-shadow:inset 0 0 40px #1c0006
}
.reels{
  display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);
  gap:4px;padding:4px;background:linear-gradient(#730b17,#35030a);border-radius:8px;
  min-height:490px
}
.cell{
  min-height:86px;display:flex;align-items:center;justify-content:center;position:relative;
  font-size:54px;border-radius:8px;background:linear-gradient(#a61b2a,#650914 56%,#42050c);
  border:1px solid #bd3936;box-shadow:inset 0 0 14px #260006;overflow:hidden;
  user-select:none
}
.cell:before{content:"";position:absolute;inset:2px;border:1px solid #ffda6720;border-radius:7px}
.cell.win{animation:winPulse .52s infinite alternate;z-index:3}
.cell.scatter{animation:scatterPulse .55s infinite alternate;z-index:4}
.cell.falling{animation:fall calc(.55s*var(--spd,1)) cubic-bezier(.2,.75,.2,1)}
@keyframes fall{0%{transform:translateY(-120%);opacity:0}70%{transform:translateY(8%);opacity:1}100%{transform:translateY(0)}}
@keyframes winPulse{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.13);filter:brightness(1.8) drop-shadow(0 0 16px #ffd84d)}}
@keyframes scatterPulse{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.17) rotate(2deg);filter:brightness(1.9) drop-shadow(0 0 22px #5ff)}}
.rowline{position:absolute;left:0;right:0;height:0;border-top:4px solid #ffe15a;box-shadow:0 0 18px #ffad00}
.overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;z-index:30;background:#14000655
}
.overlay.show{opacity:1;animation:fadeIn .18s ease-out}
.winText{
  font-size:clamp(48px,9vw,112px);font-weight:1000;font-style:italic;text-align:center;
  letter-spacing:2px;color:#fff27d;text-shadow:0 5px 0 #7d2400,0 0 9px #fff,0 0 28px #ffb000,0 0 65px #ff4d00;
  animation:megaText .55s infinite alternate
}
@keyframes megaText{to{transform:scale(1.06) rotate(-1deg)}}
.winSub{font-size:18px;font-weight:900;text-align:center;text-shadow:0 2px #000;color:#fff}
.scatterText{color:#6df5ff}
@keyframes fadeIn{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
.controls{
  display:grid;grid-template-columns:.7fr 1.6fr .7fr 1fr 1fr 1fr;gap:7px;margin-top:8px
}
.btn{
  min-height:54px;border:2px solid #f6bf45;border-radius:10px;font-weight:1000;cursor:pointer;
  box-shadow:inset 0 0 12px #fff2,0 3px 0 #551400;transition:.08s transform
}
.btn:active{transform:translateY(2px)}
.small{background:linear-gradient(#7d1729,#430713);color:#fff;font-size:22px}
.spin{background:linear-gradient(#ffc238,#df6d07);color:#fff;font-size:29px;text-shadow:0 2px #6d2b00}
.auto{background:linear-gradient(#7b27a1,#3f0b62);color:#fff;font-size:18px}
.stop{background:linear-gradient(#fff,#ccc);color:#63101b;font-size:20px}
.meter{height:10px;margin-top:8px;border:1px solid #b96d17;border-radius:10px;background:#24030a;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00cfff,#5ff,#fff,#ffd83d);transition:width .25s}
.status{
  margin-top:8px;padding:7px 10px;border-radius:8px;background:#21030a99;border:1px solid #f4ad3066;
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#ffd978;font-size:13px
}
#particles{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.coin{
  position:absolute;font-size:20px;will-change:transform,opacity;pointer-events:none;
  text-shadow:0 2px 4px #000
}
.shake{animation:shake .25s linear 2}
@keyframes shake{25%{transform:translate(5px,-3px)}50%{transform:translate(-5px,3px)}75%{transform:translate(3px,2px)}}

/* ===== MODE BADGE & BANNER ===== */
.modebox{border:2px solid #d98a1b;border-radius:9px;background:linear-gradient(#6d0c19,#39040b);padding:8px 11px}
.modebox strong{color:#fff;letter-spacing:1px}
.modeBanner{display:none;margin:0 0 6px;padding:6px 10px;text-align:center;font-weight:900;font-size:15px;
  border-radius:8px;color:#06222b;background:linear-gradient(90deg,#29e8ff,#b9fbff,#29e8ff);
  box-shadow:0 0 18px #29e8ffaa;animation:bannerGlow 1s infinite alternate}
@keyframes bannerGlow{to{filter:brightness(1.25)}}
.jack.hit{animation:jackHit .45s infinite alternate;border-color:#fff;z-index:5}
@keyframes jackHit{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.08);filter:brightness(1.9) drop-shadow(0 0 14px #ffe36a)}}
/* ===== SCATTER MODE THEME (beda total dari mode biasa) ===== */
body.scatter-mode{background:radial-gradient(circle at 50% 10%,#2a4fd0 0,#1b1f78 38%,#0a0630 82%,#02010f 100%)}
body.scatter-mode .cabinet{border-color:#29e8ff;background:linear-gradient(#1c2c8f,#0c0f45);
  box-shadow:0 0 0 2px #b9fbff inset,0 0 45px #29e8ff88}
body.scatter-mode .screen{border-color:#6df5ff;background:radial-gradient(circle at 50% 0,#3a62e6,#1b2398 48%,#0a0a40)}
body.scatter-mode .reels{background:linear-gradient(#18207e,#090b3a)}
body.scatter-mode .cell{background:linear-gradient(#3452d6,#1a2290 56%,#0d1058);border-color:#5fb8ff}
body.scatter-mode .jack,body.scatter-mode .chipbox,body.scatter-mode .freebox,body.scatter-mode .betbox,body.scatter-mode .modebox{
  border-color:#29e8ff;background:linear-gradient(#1c2c8f,#0c0f45)}
body.scatter-mode .modebox strong{color:#6df5ff;text-shadow:0 0 10px #29e8ff}
body.scatter-mode .modeBanner{display:block}
body.scatter-mode .spin{background:linear-gradient(#6df5ff,#1578d8)}

/* ===== SCATTER MODE: FULL SCENE ART ===== */
.scene{position:absolute;inset:0;display:none;z-index:0;overflow:hidden;pointer-events:none;border-radius:8px}
body.scatter-mode .scene{display:block}
.scene .rays{position:absolute;left:50%;top:50%;width:220%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(#29e8ff2e 0 9deg,transparent 9deg 18deg);animation:raySpin 24s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.scene .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#6df5ff55 0,transparent 55%)}
.scene .bigdragon{position:absolute;left:50%;top:50%;font-size:clamp(170px,38vw,360px);line-height:1;
  transform:translate(-50%,-50%);opacity:.28;filter:drop-shadow(0 0 40px #29e8ff);animation:dragonFloat 2.6s ease-in-out infinite alternate}
@keyframes dragonFloat{from{transform:translate(-50%,-47%) scale(.96)}to{transform:translate(-50%,-53%) scale(1.06)}}
.scene .side{position:absolute;top:8%;font-size:clamp(28px,6vw,64px);opacity:.8;animation:dragonFloat 2s infinite alternate}
.scene .side.l{left:2%}.scene .side.r{right:2%}
.drop{position:absolute;top:-40px;font-size:24px;opacity:.9;animation:dropFall linear forwards;text-shadow:0 0 10px #29e8ff}
@keyframes dropFall{to{transform:translateY(640px) rotate(360deg);opacity:.2}}
.reels{position:relative;z-index:1}
body.scatter-mode .reels{background:#0a0a4055}
body.scatter-mode .cell{background:linear-gradient(#3452d6cc,#0d1058cc)}
body.scatter-mode .cell.scatter{box-shadow:0 0 22px #6df5ff,inset 0 0 18px #6df5ff}

/* ===== SCATTER = JAM WEKER ===== */
.winText.alarm{animation:alarmShake .08s infinite alternate;color:#ff8a8a;
  text-shadow:0 4px 0 #6b0000,0 0 10px #fff,0 0 30px #ff3b3b,0 0 70px #ff0000}
@keyframes alarmShake{from{transform:rotate(-5deg) translateX(-6px) scale(1.04)}to{transform:rotate(5deg) translateX(6px) scale(1.04)}}
.overlay.show.alarmflash{animation:alarmFlash .22s infinite alternate}
@keyframes alarmFlash{from{background:#14000655}to{background:#ff2a2a55}}
.alarmIcons{font-size:clamp(40px,8vw,90px);text-align:center;animation:alarmShake .08s infinite alternate}
#voiceTest button{background:#ffd34d;color:#4a0a10;border:0;border-radius:6px;padding:3px 8px;font-weight:900;cursor:pointer;margin-left:2px}
/* ===== JACKPOT = SATU LAYAR PENUH GAMBAR SAMA ===== */
.reels.jpFull{animation:jpFlash .28s infinite alternate;box-shadow:0 0 40px #ffd84d,inset 0 0 40px #ffd84d}
@keyframes jpFlash{from{filter:brightness(1)}to{filter:brightness(1.6) saturate(1.4)}}
.reels.jpFull .cell{font-size:60px}
.shakeLong{animation:shake .22s linear infinite}

/* ===== SPEED + TABEL FULL GAMBAR ===== */
.speed{background:linear-gradient(#1fb6d6,#0b5f86);color:#fff;font-size:15px}
.fulltable{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;font-size:12px;color:#ffd978}
.fulltable b{color:#fff}
.fulltable span{border:1px solid #d98a1b;border-radius:8px;padding:3px 8px;background:linear-gradient(#6d0c19,#39040b)}
/* ===== ANIMASI JACKPOT MINI / MINOR / MAJOR / GRAND (BUKAN full gambar) ===== */
.jpfx{position:absolute;inset:0;z-index:29;pointer-events:none;overflow:hidden;display:none}
.jpfx.on{display:block}
.jpfx .p{position:absolute;will-change:transform,opacity}
.jpfx .ring{left:50%;top:50%;width:260px;height:260px;border-radius:50%;border:6px solid var(--c);box-shadow:0 0 30px var(--c),inset 0 0 30px var(--c)}
.jpfx .strobe{inset:0;background:var(--c);opacity:0}
.jpfx .sweep{top:-20%;bottom:-20%;left:-30%;width:22%;background:linear-gradient(100deg,transparent,#aef6ffbb,transparent);transform:skewX(-20deg);animation:jpSweep 1.2s linear infinite}
.jpfx .rays2{left:50%;top:50%;width:1500px;height:1500px;margin:-750px 0 0 -750px;
  background:repeating-conic-gradient(from 0deg,#ffd84d66 0 8deg,transparent 8deg 22deg);animation:jpSpin 6s linear infinite}
@keyframes jpRise{0%{transform:translateY(0) scale(.6) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-720px) scale(1.2) rotate(var(--r,40deg));opacity:0}}
@keyframes jpRing{0%{transform:translate(-50%,-50%) scale(.1);opacity:.95}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
@keyframes jpFall{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(760px) rotate(var(--r,200deg));opacity:.9}}
@keyframes jpSweep{from{left:-30%}to{left:125%}}
@keyframes jpBurst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
@keyframes jpStrobe{0%{opacity:0}50%{opacity:.3}}
@keyframes jpSpin{to{transform:rotate(360deg)}}
@keyframes jpFly{from{left:-22%}to{left:112%}}
@keyframes jpFlyBack{from{left:112%;transform:scaleX(-1)}to{left:-25%;transform:scaleX(-1)}}
@keyframes jpCrown{from{transform:translateY(-220px) scale(2.2);opacity:0}to{transform:none;opacity:1}}
.overlay.jpMINI{background:radial-gradient(circle,#0b3a1c88,#03120a99)}
.overlay.jpMINOR{background:radial-gradient(circle,#0b3a7a88,#02102a99)}
.overlay.jpMAJOR{background:radial-gradient(circle,#5a0a7a99,#1a023099)}
.overlay.jpGRAND{background:radial-gradient(circle,#7a1a0099,#240000bb)}
.winText.t-MINI{color:#8dffb0;text-shadow:0 5px 0 #0b4a1c,0 0 14px #fff,0 0 36px #2fe36b;animation:tBounce .5s infinite alternate}
.winText.t-MINI:before{content:"🍀 "}.winText.t-MINI:after{content:" 🍀"}
.winText.t-MINOR{color:#9fe8ff;text-shadow:0 5px 0 #08306b,0 0 14px #fff,0 0 40px #29a8ff;animation:tSwing .9s ease-in-out infinite alternate}
.winText.t-MINOR:before{content:"💎 "}.winText.t-MINOR:after{content:" 💎"}
.winText.t-MAJOR{color:#ff9cf5;text-shadow:0 5px 0 #4a0a5e,0 0 14px #fff,0 0 40px #d84dff,0 0 80px #8a1fff;animation:tSlam .4s cubic-bezier(.2,2,.4,1) infinite alternate}
.winText.t-MAJOR:before{content:"🔥 "}.winText.t-MAJOR:after{content:" 🔥"}
.winText.t-GRAND{color:#ffe36a;text-shadow:0 5px 0 #7d2400,0 0 14px #fff,0 0 50px #ff9b16,0 0 100px #ff3b00;animation:tGrand .25s infinite alternate}
.winText.t-GRAND:before{content:"👑 "}.winText.t-GRAND:after{content:" 👑"}
@keyframes tBounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-14px) scale(1.05)}}
@keyframes tSwing{from{transform:rotate(-4deg) scale(1)}to{transform:rotate(4deg) scale(1.08)}}
@keyframes tSlam{from{transform:scale(.9) skewX(-4deg)}to{transform:scale(1.13) skewX(4deg)}}
@keyframes tGrand{from{transform:scale(1.03) rotate(-1deg);filter:brightness(1)}to{transform:scale(1.15) rotate(1deg);filter:brightness(1.6)}}
/* FULL GAMBAR: animasi sendiri (zoom + letter-spacing), warna sesuai tier */
.winText.t-FULL{text-shadow:0 5px 0 #3a1200,0 0 12px #fff,0 0 34px currentColor;animation:tFull .6s ease-in-out infinite alternate}
@keyframes tFull{from{transform:scale(1);letter-spacing:2px}to{transform:scale(1.08);letter-spacing:7px}}
/* ===== AKUN, LOGIN HARIAN, MODAL ===== */
.userbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px;padding:6px 10px;border:2px solid #d98a1b;border-radius:9px;background:linear-gradient(#6d0c19,#39040b);font-size:13px;color:#ffd978}
.userbar #userName{flex:1;font-weight:900;color:#fff;min-width:150px}
.ubtn{border:2px solid #f6bf45;border-radius:8px;padding:7px 11px;font-weight:900;font-size:12px;cursor:pointer;color:#fff;background:linear-gradient(#7b27a1,#3f0b62)}
.ubtn.gold{background:linear-gradient(#ffc238,#df6d07);text-shadow:0 1px #6d2b00}
.ubtn[hidden]{display:none}
.betbox small{color:#6dff9a;font-size:11px;margin-left:4px}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#000b;padding:14px}
.modal.show{display:flex}
.mbox{width:min(480px,100%);border:4px solid var(--gold);border-radius:16px;padding:18px;text-align:center;background:linear-gradient(#8d1021,#35040d);box-shadow:0 0 40px #ffb000aa}
.mbox h2{margin:0 0 8px;color:#ffe36a;text-shadow:0 2px #672400}
.mbox p{margin:6px 0 12px;font-size:14px;color:#fff3c4;line-height:1.4}
.mbox .btn{width:100%;margin-top:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.day{border:2px solid #d98a1b;border-radius:8px;padding:6px 1px;font-size:11px;background:#39040b;color:#ffd978}
.day b{display:block;font-size:11px;color:#fff}
.day.done{opacity:.6;background:#12351d;border-color:#2fe36b}
.day.today{background:linear-gradient(#ffc238,#df6d07);color:#4a0a10;border-color:#fff;animation:winPulse .52s infinite alternate}
.day.today b{color:#4a0a10}
.mbox input{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:2px solid #f6bf45;background:#2a0409;color:#fff;font-size:16px}
#admErr{color:#ff8a8a;min-height:18px;font-size:13px;font-weight:900}
.mbox{max-height:92vh;overflow-y:auto}
.prof{display:flex;gap:12px;align-items:center;text-align:left;margin:6px 0 10px}
.avatar{font-size:42px;width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#ffd34d,#a04a00);border:3px solid #fff3b0;flex:none}
.prof b{font-size:18px;color:#fff;display:block;word-break:break-all}
.prof span{font-size:13px;color:#ffd978}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.pstats div{border:2px solid #d98a1b;border-radius:8px;padding:6px;background:#39040b;font-size:11px;color:#ffd978;word-break:break-all}
.pstats strong{display:block;font-size:14px;color:#fff}
.txlist{text-align:left;font-size:12px;color:#ffd978;margin:8px 0;max-height:110px;overflow:auto}
.txlist div{padding:3px 0;border-bottom:1px solid #ffffff22}
.rowin{display:flex;gap:6px;align-items:center}.rowin input{flex:1}
.hint{font-size:12px;color:#ffd978;margin:2px 0 6px;text-align:left;min-height:16px}
@media(max-width:760px){
  .top{grid-template-columns:1fr 1fr}.pot{grid-column:1/-1;order:-1}
  .reels{min-height:370px;gap:2px;padding:3px}.cell{min-height:63px;font-size:36px}
  .controls{grid-template-columns:1fr 1fr}.spin{grid-column:1/-1;order:-1}
  .status{font-size:11px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="top">
    <div class="jack" id="jp-GRAND"><b>GRAND • ×1000 BET</b><strong>3,520,296,400</strong></div>
    <div class="pot"><div class="crown">👑🪙👑</div><b>DRAGON ANIMAL FORTUNE</b></div>
    <div class="jack" id="jp-MAJOR"><b>MAJOR • ×250 BET</b><strong>880,000,000</strong></div>
    <div class="jack" id="jp-MINOR"><b>MINOR • ×100 BET</b><strong>440,000,000</strong></div>
    <div class="jack" id="jp-MINI"><b>MINI • ×40 BET</b><strong>176,000,000</strong></div>
  </div>

  <div class="userbar" id="userbar">
    <span id="userName">👤 Belum login</span>
    <button id="loginBtn" class="ubtn gold" type="button">👤 LOGIN PENGUNJUNG</button>
    <button id="adminBtn" class="ubtn" type="button">👑 ADMIN</button>
    <button id="freeExitBtn" class="ubtn gold" type="button" hidden>KELUAR MODE GRATIS</button>
    <button id="dailyBtn" class="ubtn gold" type="button" hidden>🎁 HARIAN</button>
    <button id="logoutBtn" class="ubtn" type="button" hidden>KELUAR</button>
    <button id="profileBtn" class="ubtn" type="button" hidden>🪪 PROFIL</button>
  </div>

  <div class="info">
    <div class="chipbox"><span id="chipLabel">CHIP</span> <strong id="balance">500,000,000</strong></div>
    <div class="betbox">BET <strong id="bet">17,600,000</strong><small id="betNote"></small></div>
    <div class="freebox">FREE SPIN <strong id="free">0</strong></div>
    <div class="chipbox">JUMLAH SPIN <strong id="spinCount">0</strong></div>
    <div class="chipbox">WIN <strong id="lastWin">0</strong></div>
    <div class="modebox">MODE <strong id="mode">NORMAL</strong></div>
  </div>

  <div class="fulltable" id="fullTable"></div>

  <section class="cabinet" id="cabinet">
    <div class="screen">

const voices=VOICE_SRCS.map(src=>{const a=new Audio(src);a.preload="auto";a.volume=1;return a});
// suara lo: BIG WIN = file 1, MEGA WIN = file 2, SUPER WIN = file 3 (urut nama file)
function voiceForLevel(level){return voices[Math.max(0,Math.min(2,level-1))]}
const voiceBufs=[null,null,null];
let voiceNode=null;
function stopVoices(){
  voices.forEach(v=>{try{v.pause();v.currentTime=0}catch(e){}});
  if(voiceNode){try{voiceNode.onended=null;voiceNode.stop()}catch(e){}voiceNode=null}
}
let decodeP=null;
function decodeVoices(){
  if(decodeP)return decodeP;
  const a=ac();if(!a)return Promise.resolve();
  decodeP=Promise.all(VOICE_SRCS.map(async(src,i)=>{
    try{
      const bin=atob(src.split(",")[1]),u=new Uint8Array(bin.length);
      for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
      voiceBufs[i]=await a.decodeAudioData(u.buffer);
    }catch(e){voiceBufs[i]=null}
  }));
  return decodeP;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms*SPD.f));}
function sleepRaw(ms){return new Promise(r=>setTimeout(r,ms));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function money(n){return Math.max(0,Math.floor(n)).toLocaleString("id-ID");}

let unlockP=null;
function unlockAudio(){
  ac();decodeVoices();
  if(audioUnlocked)return unlockP;
  audioUnlocked=true;
  // buka kunci ketiga suara dari klik user (kebijakan autoplay browser)
  unlockP=Promise.all(voices.map(v=>new Promise(res=>{
    try{
      v.muted=true;
      const done=()=>{v.pause();v.currentTime=0;v.muted=false;res()};
      const p=v.play();
      if(p&&p.then)p.then(done).catch(()=>{v.muted=false;audioUnlocked=false;res()});else done();
    }catch(e){res()}
  })));
  return unlockP;
}
function duck(on){
  try{if(master&&AC)master.gain.setTargetAtTime(on?.15:.55,AC.currentTime,.05)}catch(e){}
}
async function speakWin(level=1){
  if(!voiceOn)return;
  const idx=Math.max(0,Math.min(2,level-1));
  const label=document.getElementById("voiceState");
  const done=()=>{duck(false);label.textContent="VOICE: READY"};
  // jalur 1: WebAudio (sama dengan efek koin/alarm)
  try{
    const a=ac();
    if(a){
      await decodeVoices();
      await a.resume();
      if(voiceBufs[idx]&&a.state==="running"){
        stopVoices();
        const src=a.createBufferSource(),g=a.createGain();
        src.buffer=voiceBufs[idx];g.gain.value=1;
        src.connect(g);g.connect(a.destination);   // langsung ke speaker, tidak lewat master
        voiceNode=src;
        duck(true);label.textContent="VOICE: PLAYING 🔊";
        src.onended=done;setTimeout(done,3600);
        src.start();
        return;
      }
    }
  }catch(e){}
  // jalur 2 (cadangan): <audio>
  const v=voiceForLevel(level);
  try{
    if(unlockP)await unlockP;
    stopVoices();v.muted=false;v.volume=1;v.currentTime=0;
    duck(true);label.textContent="VOICE: PLAYING";
    v.onended=done;setTimeout(done,3600);
    await v.play();
  }catch(e){
    duck(false);label.textContent="VOICE: TAP LAYAR / KLIK SPIN DULU";
  }
}

/* ===== SOUND ENGINE (WebAudio, tanpa file luar) ===== */
let AC=null,master=null,bgmTimer=null,bgmStep=0,rainTimer=null;
function ac(){
  if(!AC){
    try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);}catch(e){}
  }
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(f,t0,d,type="sine",vol=.2,slide=0){
  const a=ac();if(!a||!voiceOn)return;
  const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function hat(t0,vol=.05){
  const a=ac();if(!a||!voiceOn)return;
  const len=a.sampleRate*.04,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(),g=a.createGain(),hp=a.createBiquadFilter();
  hp.type="highpass";hp.frequency.value=6000;g.gain.value=vol;
  src.buffer=buf;src.connect(hp);hp.connect(g);g.connect(master);src.start(a.currentTime+t0);
}
// satu koin: dua nada logam tidak harmonis + klik
function coinPing(t0,vol=.07){
  const f=1800+Math.random()*2400;
  tone(f,t0,.14,"sine",vol);
  tone(f*2.76,t0,.07,"sine",vol*.55);
  if(Math.random()<.5)hat(t0,.035);
}
// hamburan koin: rapat di awal lalu menjarang, seperti koin tumpah
function coinShower(dur=2,count=40,vol=.07){
  for(let i=0;i<count;i++){
    const t=Math.pow(Math.random(),1.5)*dur;
    coinPing(t,vol*(0.6+Math.random()*.7));
  }
}
// jam weker: palu memukul dua bel bergantian, 3 rentetan
function alarmClock(rings=3,off=0,v=1){
  for(let r=0;r<rings;r++){
    const base=off+r*.62;
    for(let i=0;i<9;i++){
      const t=base+i*.052;
      tone(i%2?2480:2780,t,.045,"square",.07*v);
      tone(i%2?3720:4170,t,.03,"sine",.04*v);
    }
  }
}

/* ===== AUDIO JACKPOT: BEDA TIAP TIER, ±5 DETIK ===== */
const NT=n=>261.63*Math.pow(2,n/12);
function noiseBurst(t0,d,vol,ftype="highpass",freq=4000){
  const a=ac();if(!a||!voiceOn)return;
  const len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);
  const src=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
  f.type=ftype;f.frequency.value=freq;g.gain.value=vol;
  src.buffer=buf;src.connect(f);f.connect(g);g.connect(master);src.start(a.currentTime+t0);
}
function kick(t){tone(150,t,.26,"sine",.45,-112);noiseBurst(t,.03,.15,"lowpass",900)}
function snare(t,v=.2){noiseBurst(t,.16,v,"bandpass",1900);tone(210,t,.1,"triangle",v*.7)}
function crash(t,v=.2,d=1.4){noiseBurst(t,d,v,"highpass",4500)}
function chordAt(notes,t,d,type="sawtooth",vol=.07,fat=false){
  notes.forEach(n=>{
    tone(NT(n),t,d,type,vol);
    if(fat){tone(NT(n)*1.007,t,d,type,vol*.8);tone(NT(n)*.993,t,d,type,vol*.8)}
  });
}
function seqNotes(notes,t0,step,type,vol,dur){notes.forEach((n,i)=>{if(n!==null)tone(NT(n),t0+i*step,dur,type,vol)})}
const JPSND={

  const roll=Math.random();
  let rows=0;

  else if(roll<M.rows3+M.rows2+M.rows1)rows=1;
  if(rows){

    selected.forEach(r=>{for(let c=0;c<COLS;c++)board[r][c]=animal});

function fxEl(fx,cls,txt,st){
  const d=document.createElement("div");d.className="p "+cls;if(txt)d.textContent=txt;
  for(const k in st){if(k.startsWith("--"))d.style.setProperty(k,st[k]);else d.style[k]=st[k]}
  fx.appendChild(d);return d;
}
function fxBurst(fx,x,y,icons,n,dist){
  for(let i=0;i<n;i++){
    const ang=Math.PI*2*i/n+Math.random()*.4,d=dist*(.6+Math.random()*.6);
    const e=fxEl(fx,"",pick(icons),{left:x+"%",top:y+"%",fontSize:(18+Math.random()*18)+"px",
      "--dx":Math.cos(ang)*d+"px","--dy":Math.sin(ang)*d+"px",animation:"jpBurst "+(.9+Math.random()*.5)+"s ease-out forwards"});
    setTimeout(()=>e.remove(),1700);
  }
}
function jpFX(t){
  const fx=document.getElementById("jpfx");
  jpFXOff();
  fx.className="jpfx on "+t;
  const R=(a,b)=>a+Math.random()*(b-a);
  if(t==="MINI"){            // 🍀 hijau: ring melebar + semanggi melayang naik
    for(let i=0;i<3;i++)fxEl(fx,"ring","",{"--c":"#7dffb0",animation:`jpRing 1.8s ease-out ${i*.6}s infinite`});
    for(let i=0;i<26;i++)fxEl(fx,"",pick(["🍀","✨","🍀","🪙"]),{left:R(2,95)+"%",top:"100%",fontSize:R(22,42)+"px","--r":R(-70,70)+"deg",animation:`jpRise ${R(2.6,4.2)}s ease-out ${R(0,3)}s infinite`});
  }else if(t==="MINOR"){     // 💎 biru: kilau menyapu + berlian berjatuhan
    for(let i=0;i<2;i++)fxEl(fx,"sweep","",{animationDelay:(i*.55)+"s"});
    for(let i=0;i<24;i++)fxEl(fx,"",pick(["💎","💎","✨","🔷"]),{left:R(2,95)+"%",top:"-12%",fontSize:R(24,46)+"px","--r":R(-360,360)+"deg",animation:`jpFall ${R(1.8,3.2)}s linear ${R(0,3)}s infinite`});
  }else if(t==="MAJOR"){     // 🔥 ungu: strobo + kembang api meledak beruntun
    fxEl(fx,"strobe","",{"--c":"#d84dff",animation:"jpStrobe .4s steps(2) infinite"});
    const go=()=>fxBurst(fx,R(12,88),R(15,80),["🔥","💥","✦","🔥"],14,190);
    go();jpFXTimer=setInterval(go,380);
  }else{                     // 👑 GRAND emas: sinar berputar + naga terbang + mahkota jatuh + strobo
    fxEl(fx,"rays2","",{});
    fxEl(fx,"strobe","",{"--c":"#fff2a8",animation:"jpStrobe .28s steps(2) infinite"});
    fxEl(fx,"","🐉",{top:"10%",fontSize:"120px",animation:"jpFly 2.6s linear infinite"});
    fxEl(fx,"","🐉",{top:"62%",fontSize:"90px",animation:"jpFlyBack 3.1s linear .8s infinite"});
    fxEl(fx,"","👑",{left:"50%",top:"3%",marginLeft:"-50px",fontSize:"100px",animation:"jpCrown 1s cubic-bezier(.2,1.6,.4,1) both"});
    const go=()=>fxBurst(fx,R(10,90),R(15,85),["🪙","✦","🔥","👑"],16,230);
    go();jpFXTimer=setInterval(go,300);
  }
}
function jpFXOff(){
  if(jpFXTimer){clearInterval(jpFXTimer);jpFXTimer=null}
  const fx=document.getElementById("jpfx");fx.className="jpfx";fx.innerHTML="";
}
async function showScatter(count){
  const entering=!scatterMode;
  const extra=(entering?SCATTER_SPINS_ENTER:SCATTER_SPINS_RETRIGGER)[count]||(entering?6:3);
  freeSpins+=extra;
  if(entering)setMode(true);
  updateUI();updateBanner();
  const wt=document.getElementById("winText"),ov=document.getElementById("overlay");
  wt.textContent=entering?"⏰ SCATTER! ⏰":"⏰ RETRIGGER! ⏰";
  wt.classList.add("alarm");
  document.getElementById("winSub").textContent=`${count} SCATTER • +${extra} FREE SPIN • SISA ${freeSpins}${entering?" • WIN ×"+MODES.scatter.mult:""}`;
  ov.classList.add("show","alarmflash");
  document.getElementById("cabinet").classList.add("shake");
  document.getElementById("meter").style.width="100%";
  burstCoins(false);
  SFX.scatter();                 // suara jam weker
  await sleep(1900);
  ov.classList.remove("show","alarmflash");
  wt.classList.remove("alarm");
  document.getElementById("cabinet").classList.remove("shake");
    document.getElementById("msg").textContent="Scatter aktif — free spin dimulai!";
  return 0;
}
async function endScatterMode(){
  document.getElementById("winText").textContent="SCATTER SELESAI";
  document.getElementById("winSub").textContent=`TOTAL SCATTER MODE +${money(scatterTotal)}`;
  document.getElementById("overlay").classList.add("show");
  await sleep(1500);
  document.getElementById("overlay").classList.remove("show");
  setMode(false);
  document.getElementById("msg").textContent="Kembali ke mode NORMAL";
}
async function spin(isFree=false){
  if(busy||modalOpen)return 0;
  if(freeSpins>0)isFree=true;
  if(!isFree)clampBet();          // bet otomatis turun kalau chip tidak cukup
  if(!isFree&&!isAdmin()&&balance<BET_STEP){openBroke();return 0}   // chip habis -> tawarkan mode gratis
  busy=true;
  spinCount++;
  unlockAudio();
  document.getElementById("spin").disabled=true;
  document.getElementById("meter").style.width="0%";
  if(!bgmTimer)startBgm();
  SFX.spin();
  const mode=isFree?"scatter":"normal";
  let win=0,rescue=false;

  if(isFree){
    freeSpins=Math.max(0,freeSpins-1);
    if(!scatterMode)setMode(true);
  }else{
        if(!isAdmin())balance-=bet;             // hanya admin yang chipnya tidak pernah berkurang
  }
  updateUI();updateBanner();
  document.getElementById("msg").textContent=isFree?"SCATTER MODE — FREE SPIN…":"REELS BERPUTAR…";
  // tentukan dulu apakah spin ini FULL GAMBAR / JACKPOT (dua hadiah terpisah), semua murni hoki
  let special=null;
  if(Math.random()<MODES[mode].full)special={kind:"full",animal:pickAnimal()};
  else{const jp=rollJackpotSpin();if(jp)special={kind:"jp",tier:jp}}
  seedResult(mode,!!special);render(true);
  await sleep(850);
  SFX.land();

  if(special){
    const why=isFree?"FREE SPIN":"SPIN";
    win=special.kind==="full"?await awardFull(special.animal,why):await awardJackpot(special.tier,why);
    document.getElementById("lastWin").textContent=money(win);
  }else{
    const rows=countRows();
    const scat=countScatter();
    const t=tier(rows.length,mode);
    if(t){
      win=t.mult*bet;balance+=win;
      if(scatterMode)scatterTotal+=win;
      document.getElementById("msg").textContent=`${t.name} • ${rows.length} BARIS • +${money(win)}`;
      updateUI();updateBanner();
      await showOverlay(t.name,`${rows.length} BARIS PENUH • ×${t.mult} • +${money(win)}`,t.pct,rows.length>=2);
    }else{
      document.getElementById("msg").textContent=isFree?"SCATTER MODE — belum kena":"Tidak kena — CHIP berkurang";
      await sleep(260);
    }
    if(scat>=3){
      win+=await showScatter(scat);
    }
    document.getElementById("lastWin").textContent=money(win);
  }

  if(scatterMode && freeSpins===0)await endScatterMode();
  if(freeSpins===0)clampBet();    // chip berubah setelah spin -> sesuaikan bet
  updateUI();
  document.getElementById("spin").disabled=false;
  busy=false;
  if(!isAdmin()&&freeSpins===0&&balance<BET_STEP)openBroke();
  return win;
}
async function autoLoop(){
  while(auto){
    if(!busy){
      if(freeSpins>0)await spin(true);
      else await spin(false);
    }
    await sleep(350);
  }
}

/* ===== BET OTOMATIS, AKUN & PROFIL PEMAIN, KIRIM CHIP, SIMPAN DATA, LOGIN HARIAN ===== */
const DEFAULTS={balance:500000000,bet:17600000};
const DAILY_REWARD=[10000000,20000000,30000000,40000000,60000000,80000000,150000000]; // hari 1..7, lalu mengulang
const TRANSFER_MIN=1000000000,TAX_PCT=5;   // kirim chip: minimal 1B, pajak 5% dipotong dari jumlah kirim
const LS={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
function setMsg(t){document.getElementById("msg").textContent=t}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateKey(d=new Date()){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function yesterdayKey(){const d=new Date();d.setDate(d.getDate()-1);return dateKey(d)}

// bet tidak boleh lebih besar dari chip (kelipatan langkah bet). Chip kurang dari bet minimum -> pemain ditawari mode gratis
function maxAffordableBet(){return balance>=BET_STEP?Math.floor(balance/BET_STEP)*BET_STEP:BET_STEP}
let betNoteTimer=null;
function isAdmin(){return !!(acct&&acct.admin)}
function clampBet(){
  const before=bet;
  const cap=isAdmin()?BET_MAX:Math.min(BET_MAX,maxAffordableBet());
  bet=Math.max(BET_STEP,Math.min(bet,cap));
  if(bet<before){
    const n=document.getElementById("betNote");
    n.textContent="↓ otomatis";
    clearTimeout(betNoteTimer);betNoteTimer=setTimeout(()=>{n.textContent=""},2500);
    return true;
  }
  return false;
}

/* ----- penyimpanan akun (localStorage, per browser/perangkat) ----- */
function rawAccounts(){
  const out=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf("daf_acct_")===0){
        try{const a=JSON.parse(localStorage.getItem(k));if(a&&a.id)out.push(a)}catch(e){}
      }
    }
  }catch(e){}
  return out;
}
function newPid(){   // ID pemain: 8 digit, unik
  const used=new Set(rawAccounts().map(a=>String(a.pid)));
  let p;do{p=String(Math.floor(20000000+Math.random()*80000000))}while(used.has(p));
  return p;
}
function fixAcct(a){   // akun lama (tanpa ID pemain) otomatis dilengkapi
  if(!a||typeof a!=="object"||!a.id)return null;
  let dirty=false;
  if(!a.pid){a.pid=newPid();dirty=true}
  if(!a.name){a.name=String(a.id);dirty=true}
  if(!Array.isArray(a.tx)){a.tx=[];dirty=true}
  if(dirty)LS.set("daf_acct_"+a.id,JSON.stringify(a));
  return a;
}
function loadAcct(id){let a=null;try{a=JSON.parse(LS.get("daf_acct_"+id))}catch(e){}return fixAcct(a)}
function listAccounts(){return rawAccounts().map(fixAcct).filter(Boolean)}
function findAccount(q){   // cari lewat ID pemain (8 digit) atau username
  q=String(q).trim().replace(/^#/,"");
  if(!q)return null;
  const all=listAccounts();
  if(/^\d{8}$/.test(q))return all.find(a=>String(a.pid)===q)||null;
  const lq=q.toLowerCase();
  return all.find(a=>String(a.name).toLowerCase()===lq)||null;
}
function saveGame(){
  if(!acct||acct.admin)return;
  const real=(freeMode&&stash)?stash:{balance,bet};
  acct.balance=real.balance;acct.bet=real.bet;acct.spinCount=spinCount;acct.freeSpins=freeMode?0:freeSpins;acct.updated=Date.now();
  LS.set("daf_acct_"+acct.id,JSON.stringify(acct));
}
function avatarOf(a){return a.admin?"👑":animals[(parseInt(a.pid,10)||0)%animals.length].e}
function logTx(a,t){a.tx=a.tx||[];a.tx.unshift(t);if(a.tx.length>15)a.tx.length=15}
function createGuest(){
  const pid=newPid();
  const used=new Set(rawAccounts().map(a=>String(a.name).toLowerCase()));
  let name;do{name="Tamu"+Math.floor(1000+Math.random()*9000)}while(used.has(name.toLowerCase()));
  return{id:pid,pid,name,balance:DEFAULTS.balance,bet:DEFAULTS.bet,spinCount:0,freeSpins:0,streak:0,lastDaily:"",created:Date.now(),tx:[]};
}

let inboxNote="";
function applyAcct(a){
  acct=a;freeMode=false;stash=null;BET_STEP=REAL_STEP;
  balance=a.balance;bet=a.bet;spinCount=a.spinCount||0;freeSpins=a.freeSpins||0;

  else if(freeSpins===0&&scatterMode)setMode(false);
  clampBet();
  updateUserBar();updateUI();updateBanner();

  acct=null;                                  // supaya saveGame tidak menulis ulang akun yang baru dihapus
  resetSession(`Akun ${name} sudah dihapus`);
  openWelcome();
}

/* ----- profil pemain ----- */
function txLine(t){
  const d=new Date(t.ts).toLocaleDateString("id-ID");
  return t.k==="out"
    ?`<div>📤 −${money(t.amt)} ke ${esc(t.peer)} • pajak ${money(t.tax)} • ${d}</div>`
    :`<div>📥 +${money(t.net)} dari ${esc(t.peer)} • ${d}</div>`;
}
function openProfile(){
  if(!acct)return;
  const adm=isAdmin();
  const real=(freeMode&&stash)?stash.balance:balance;
  const tx=(acct.tx||[]).slice(0,5).map(txLine).join("")||"<div>Belum ada transaksi</div>";
  openModal(`<h2>🪪 PROFIL PEMAIN</h2>
  <div class="prof"><div class="avatar">${avatarOf(acct)}</div>
    <div><b>${esc(acct.name)}</b><span>ID ${esc(acct.pid)}</span>${adm?"":` <button class="ubtn" type="button" style="padding:3px 8px" onclick="copyPid()">SALIN ID</button>`}</div></div>
  <div class="pstats">
    <div>CHIP<strong>${adm?"∞":money(real)}</strong></div>
    <div>TOTAL SPIN<strong>${spinCount.toLocaleString("id-ID")}</strong></div>
    <div>STREAK HARIAN<strong>${adm?"-":(acct.streak||0)+" hari"}</strong></div>
    <div>BERGABUNG<strong>${acct.created?new Date(acct.created).toLocaleDateString("id-ID"):"-"}</strong></div>
  </div>
  ${adm?"":`<div class="rowin"><input id="pfName" type="text" maxlength="12" value="${esc(acct.name)}" autocomplete="off" autocapitalize="off"><button class="ubtn gold" type="button" onclick="renameUser()">GANTI NAMA</button></div>
  <div id="pfErr" class="hint" style="color:#ff8a8a;font-weight:900"></div>`}
  <button class="btn spin" type="button" style="font-size:18px" onclick="openTransfer()">📤 KIRIM CHIP</button>
  <div class="txlist"><b style="color:#fff">Riwayat terakhir</b>${tx}</div>
  ${adm?"":`<button class="btn small" type="button" style="font-size:14px;background:linear-gradient(#7d1729,#430713)" onclick="openDeleteConfirm()">🗑️ HAPUS AKUN</button>`}
  <button class="btn small" type="button" style="font-size:14px" onclick="closeModal()">TUTUP</button>`);
}
function copyPid(){
  const t=String(acct.pid);
  try{navigator.clipboard.writeText(t).then(()=>setMsg("ID disalin: "+t),()=>setMsg("ID kamu: "+t))}catch(e){setMsg("ID kamu: "+t)}
}
async function renameUser(){
  const v=document.getElementById("pfName").value.trim(),err=document.getElementById("pfErr");
  if(!/^[A-Za-z0-9_]{3,12}$/.test(v)||/^\d{8}$/.test(v)){err.textContent="Username 3–12 karakter: huruf, angka, atau _ (bukan 8 digit angka)";return}
  const lv=v.toLowerCase(),a=acct;
  if(lv===ADMIN_USER.toLowerCase()||rawAccounts().some(x=>x.id!==a.id&&String(x.name).toLowerCase()===lv)){err.textContent="Username sudah dipakai";return}
  if(FB.ok){
    err.textContent="Memeriksa…";
    const prev=a.name;
    try{
      const ns=await FB.db.collection("names").doc(lv).get();
      if(ns.exists&&ns.data().uid!==FB.uid){err.textContent="Username sudah dipakai";return}
      a.name=v;await fbRegister(a);
    }catch(e){a.name=prev;console.warn(e);err.textContent="Gagal terhubung ke server, coba lagi";return}
  }else a.name=v;
  if(acct!==a)return;
  saveGame();updateUserBar();openProfile();
  setMsg("Username diganti menjadi "+a.name);
}

/* ----- kirim chip: lewat ID pemain / username, minimal 1B, pajak 5% ----- */
let trDraft=null;
function parseChips(s){   // 1b / 2.5b / 1,5b / 500m / 1.000.000.000
  s=String(s).trim().toLowerCase().replace(/\s/g,"");
  const m=s.match(/^([\d.,]+)([kmb])?$/);
  if(!m)return NaN;
  const mult={k:1e3,m:1e6,b:1e9}[m[2]]||1;
  let num=m[1];
  if(m[2]){num=num.replace(",",".");if((num.match(/\./g)||[]).length>1)return NaN}
  else num=num.replace(/[.,]/g,"");
  const v=Number(num)*mult;
  return isFinite(v)?Math.floor(v):NaN;
}
function trBasic(q,amt){   // cek yang tidak butuh jaringan; "" = lolos
  if(!acct)return"Login dulu";
  if(busy)return"Tunggu spin selesai dulu";
  if(freeMode)return"Keluar dari mode gratis dulu — chip gratis tidak bisa dikirim";
  if(!q)return"Isi ID pemain atau username penerima";
  if(!Number.isFinite(amt))return"Jumlah tidak valid (contoh: 1b, 2.5b, atau 1000000000)";
  if(amt<TRANSFER_MIN)return`Minimal kirim ${money(TRANSFER_MIN)} chip (1B)`;
  if(!isAdmin()&&amt>balance)return`Chip tidak cukup (chip kamu ${money(balance)})`;
  return"";
}
async function trFind(q){   // Firebase = lintas perangkat; tanpa Firebase = hanya akun di perangkat ini
  await fbInit();
  if(FB.ok)return fbFind(q);
  if(fbConfigured())throw Object.assign(new Error("Tidak bisa terhubung ke server. Cek internet lalu coba lagi"),{user:true});
  return findAccount(q);
}
async function trCheck(q,amt){
  const m=trBasic(q,amt);if(m)return{msg:m};
  let to=null;
  try{to=await trFind(q)}catch(e){console.warn(e);return{msg:e.user?e.message:"Gagal terhubung ke server. Coba lagi"}}
  if(!acct)return{msg:"Login dulu"};
  if(!to)return{msg:"Penerima tidak ditemukan. Periksa ID pemain / username"};
  if(!isAdmin()&&String(to.pid)===String(acct.pid))return{msg:"Tidak bisa mengirim chip ke diri sendiri"};
  return{to};
}
function openTransfer(){
  if(!acct)return;
  openModal(`<h2>📤 KIRIM CHIP</h2>
  <p>Minimal kirim <b>${money(TRANSFER_MIN)}</b> (1B). Pajak <b>${TAX_PCT}%</b> dipotong dari jumlah yang dikirim. Chip kamu: <b>${isAdmin()?"∞":money(balance)}</b></p>
  <input id="trTo" type="text" placeholder="ID pemain atau username penerima" autocomplete="off" autocapitalize="off" value="${trDraft?esc(trDraft.q):""}">
  <input id="trAmt" type="text" placeholder="Jumlah chip (contoh: 1b, 2.5b)" autocomplete="off" oninput="trPreview()" value="${trDraft?esc(trDraft.amtStr):""}">
  <div id="trPrev" class="hint"></div>
  <div id="trErr" style="color:#ff8a8a;font-size:13px;font-weight:900;min-height:18px"></div>
  <button class="btn spin" type="button" style="font-size:18px" onclick="trReview()">LANJUT</button>
  <button class="btn small" type="button" style="font-size:14px" onclick="openProfile()">KEMBALI</button>`);
  trPreview();
}
function trPreview(){
  const a=parseChips(document.getElementById("trAmt").value),el=document.getElementById("trPrev");
  if(!Number.isFinite(a)||a<=0){el.textContent="";return}
  const tax=Math.floor(a*TAX_PCT/100);
  el.textContent=`Pajak ${TAX_PCT}%: ${money(tax)} • Penerima mendapat: ${money(a-tax)}`;
}
let trChecking=false,trSending=false;
async function trReview(){
  if(trChecking)return;
  const q=document.getElementById("trTo").value.trim(),amtStr=document.getElementById("trAmt").value.trim();
  const amt=parseChips(amtStr),errEl=document.getElementById("trErr");
  const m=trBasic(q,amt);
  if(m){errEl.style.color="#ff8a8a";errEl.textContent=m;return}
  errEl.style.color="#ffd978";errEl.textContent="Mencari penerima…";
  trChecking=true;
  let r;
  try{r=await trCheck(q,amt)}finally{trChecking=false}
  const e2=document.getElementById("trErr");
  if(!e2||!modalOpen)return;   // modal sudah ditutup/diganti
  if(r.msg){e2.style.color="#ff8a8a";e2.textContent=r.msg;return}
  trDraft={q,amtStr,amt};
  const tax=Math.floor(amt*TAX_PCT/100);
  openModal(`<h2>⚠️ KONFIRMASI KIRIM</h2>
  <div class="pstats">
    <div>PENERIMA<strong>${esc(r.to.name)}<br>ID ${esc(r.to.pid)}</strong></div>
    <div>DIKIRIM<strong>${money(amt)}</strong></div>
    <div>PAJAK ${TAX_PCT}%<strong>${money(tax)}</strong></div>
    <div>DITERIMA<strong>${money(amt-tax)}</strong></div>
  </div>
  <p>Transaksi tidak bisa dibatalkan.</p>
  <button class="btn spin" type="button" style="font-size:18px" onclick="confirmTransfer()">YA, KIRIM</button>
  <button class="btn small" type="button" style="font-size:14px" onclick="openTransfer()">UBAH</button>`);
}
function pushInbox(id,item){
  let arr=[];
  try{arr=JSON.parse(LS.get("daf_inbox_"+id))||[]}catch(e){arr=[]}
  arr.push(item);
  return LS.set("daf_inbox_"+id,JSON.stringify(arr));
}
function txStored(a,t){   // catat riwayat ke akun a (aktif atau yang tersimpan)
  if(a===acct){logTx(a,t);saveGame()}
  else{const rec=loadAcct(a.id);if(rec){logTx(rec,t);LS.set("daf_acct_"+rec.id,JSON.stringify(rec))}}
}
async function confirmTransfer(){
  const t=trDraft;if(!t||!acct||trSending)return;
  trSending=true;
  const a=acct,adm=isAdmin();
  try{
    const r=await trCheck(t.q,t.amt);
    if(r.msg){openInfo("❌ GAGAL",esc(r.msg),"openTransfer()");return}
    const m=trBasic(t.q,t.amt);   // cek ulang chip tepat sebelum kirim (setelah menunggu jaringan)
    if(m||acct!==a){openInfo("❌ GAGAL",esc(m||"Akun berubah"),"openTransfer()");return}
    const to=r.to,amt=t.amt,tax=Math.floor(amt*TAX_PCT/100),net=amt-tax;
    const fromLabel=adm?"ADMIN":`${a.name} (ID ${a.pid})`;
    if(!adm){balance-=amt;clampBet();updateUI();saveGame()}   // chip ditahan dulu, dikembalikan kalau gagal
    const item={from:fromLabel,fromUid:FB.uid||"",amount:amt,tax,net,ts:Date.now()};
    let ok=false;
    try{ok=FB.ok?(await fbSend(to,item),true):pushInbox(to.id,item)}catch(e){console.warn(e);ok=false}
    if(!ok){
      if(!adm)creditAcct(a,amt,null);
      openInfo("❌ GAGAL","Chip tidak terkirim (cek koneksi internet). Chip kamu dikembalikan.","closeModal()");return;
    }
    txStored(a,{k:"out",amt,tax,net,peer:`${to.name} (ID ${to.pid})`,ts:Date.now()});
    trDraft=null;
    updateUI();updateUserBar();
    openInfo("✅ CHIP TERKIRIM",`Dikirim <b>${money(amt)}</b> ke <b>${esc(to.name)}</b> (ID ${esc(to.pid)}).<br>Pajak ${TAX_PCT}%: ${money(tax)} • Diterima: ${money(net)}`,"closeModal()");
    setMsg(`Chip terkirim ke ${to.name}`);
  }finally{trSending=false}
}
function claimInbox(){   // ambil chip kiriman yang menunggu; kembalikan teks ringkasan ("" kalau kosong)
  if(!acct||acct.admin)return "";
  const k="daf_inbox_"+acct.id;
  let arr=[];
  try{arr=JSON.parse(LS.get(k))||[]}catch(e){arr=[]}
  if(!arr.length)return "";
  LS.del(k);
  let total=0,lines="";
  arr.forEach(it=>{
    total+=it.net;
    logTx(acct,{k:"in",amt:it.amount,tax:it.tax,net:it.net,peer:it.from,ts:it.ts});
    lines+=`${esc(it.from)}: <b>+${money(it.net)}</b><br>`;
  });
  if(freeMode&&stash)stash.balance+=total;else balance+=total;
  updateUI();
  return lines;
}

/* ===== FIREBASE: kirim chip antar pemain / antar perangkat ===== */
const FB={ok:false,db:null,uid:null,unsub:null,ready:null};
let fbClaiming=false,fbRecheck=false,fbNotes=[];
function fbConfigured(){return typeof FIREBASE_CONFIG==="object"&&!!FIREBASE_CONFIG.apiKey&&!/^ISI_/.test(FIREBASE_CONFIG.apiKey)}
function fbInit(){
  if(FB.ready)return FB.ready;
  FB.ready=(async()=>{
    if(!fbConfigured()){console.info("Firebase belum diisi — kirim chip hanya antar akun di perangkat ini");return false}
    if(typeof firebase==="undefined"){console.warn("SDK Firebase gagal dimuat (offline?)");return false}
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      FB.db=firebase.firestore();
      const au=firebase.auth();
      const cur=await new Promise(res=>{const u=au.onAuthStateChanged(x=>{u();res(x)})});
      FB.uid=(cur||(await au.signInAnonymously()).user).uid;
      FB.ok=true;return true;
    }catch(e){console.warn("Firebase gagal:",e);FB.err=e;setTimeout(()=>{try{setMsg("☁️ Firebase gagal: "+(e.code||e.message))}catch(_){}},800);return false}
  })();
  return FB.ready;
}
function nameKey(n){return String(n).toLowerCase()}
async function fbRegister(a){   // daftarkan ID pemain + username supaya bisa dicari pemain lain
  if(!FB.ok||!a||a.admin)return;
  const db=FB.db,P=db.collection("profiles"),N=db.collection("names");
  let changed=false;
  for(let i=0;i<6;i++){                       // ID bentrok dengan pemain lain -> buat ID baru
    const ps=await P.doc(String(a.pid)).get();
    if(!ps.exists||ps.data().uid===FB.uid)break;
    a.pid=newPid();changed=true;
  }
  let nk=nameKey(a.name);
  for(let i=0;i<6;i++){                       // username sudah dipakai pemain lain -> beri angka
    const ns=await N.doc(nk).get();
    if(!ns.exists||ns.data().uid===FB.uid)break;
    a.name=String(a.name).slice(0,8)+Math.floor(1000+Math.random()*9000);nk=nameKey(a.name);changed=true;
  }
  const pid=String(a.pid),pRef=P.doc(pid),ps=await pRef.get(),old=ps.exists?ps.data():null;
  if(!(old&&old.uid===FB.uid&&old.nameLc===nk&&old.name===a.name)){
    const b=db.batch();
    b.set(pRef,{pid,name:a.name,nameLc:nk,uid:FB.uid,updated:Date.now()});
    b.set(N.doc(nk),{pid,uid:FB.uid});
    if(old&&old.nameLc&&old.nameLc!==nk){
      const os=await N.doc(old.nameLc).get();
      if(os.exists&&os.data().uid===FB.uid)b.delete(N.doc(old.nameLc));
    }
    await b.commit();
  }
  if(changed&&a===acct){saveGame();updateUserBar();setMsg(`Akun disesuaikan: ${a.name} • ID ${a.pid}`)}
}
async function fbFind(q){   // cari lewat ID 8 digit atau username
  q=String(q).trim().replace(/^#/,"");
  let pid=null;
  if(/^\d{8}$/.test(q))pid=q;
  else if(/^[A-Za-z0-9_]{1,12}$/.test(q)){
    const n=await FB.db.collection("names").doc(nameKey(q)).get();
    if(!n.exists)return null;
    pid=String(n.data().pid);
  }else return null;
  const p=await FB.db.collection("profiles").doc(pid).get();
  if(!p.exists)return null;
  const d=p.data();
  return{pid:d.pid,name:d.name,uid:d.uid};
}
function fbSend(to,item){
  return FB.db.collection("profiles").doc(String(to.pid)).collection("inbox").add(item);
}
function creditAcct(a,amt,tx){   // tambah chip ke akun a (yang sedang aktif atau yang tersimpan)
  if(a===acct){
    if(freeMode&&stash)stash.balance+=amt;else balance+=amt;
    if(tx)logTx(a,tx);
    updateUI();saveGame();
  }else{
    const rec=loadAcct(a.id);if(!rec)return;
    rec.balance=(rec.balance||0)+amt;if(tx)logTx(rec,tx);
    LS.set("daf_acct_"+rec.id,JSON.stringify(rec));
  }
}
async function fbClaim(a){   // ambil semua chip kiriman di inbox online
  if(fbClaiming){fbRecheck=true;return}
  fbClaiming=true;
  try{
    do{
      fbRecheck=false;
      if(acct!==a||a.admin)break;
      const snap=await FB.db.collection("profiles").doc(String(a.pid)).collection("inbox").get();
      let total=0,lines="";
      for(const d of snap.docs){
        if(acct!==a)break;
        let it=null;   // transaksi: hanya satu perangkat/tab yang berhasil mengambil tiap kiriman
        try{await FB.db.runTransaction(async tx=>{const s=await tx.get(d.ref);it=s.exists?s.data():null;if(it)tx.delete(d.ref)})}catch(e){it=null}
        const net=it?Number(it.net):0;
        if(!(net>0))continue;
        creditAcct(a,net,{k:"in",amt:it.amount,tax:it.tax,net,peer:String(it.from||"?"),ts:it.ts||Date.now()});
        total+=net;lines+=`${esc(it.from||"?")}: <b>+${money(net)}</b><br>`;
      }
      if(total>0){fbNotes.push(lines);setMsg("📥 Chip kiriman diterima: +"+money(total));showFbNotes()}
    }while(fbRecheck);
  }catch(e){console.warn("Ambil chip gagal:",e)}
  finally{fbClaiming=false}
}
function showFbNotes(){
  if(!fbNotes.length||modalOpen)return;      // dicoba lagi saat modal ditutup
  if(busy){setTimeout(showFbNotes,1500);return}
  const html=fbNotes.join("");fbNotes=[];
  openInfo("📥 CHIP MASUK",html,"closeModal()");
}
function fbUnwatch(){if(FB.unsub){try{FB.unsub()}catch(e){}FB.unsub=null}}
function fbWatch(a){   // live: chip masuk langsung diterima tanpa refresh
  fbUnwatch();
  if(!FB.ok||a.admin)return;
  FB.unsub=FB.db.collection("profiles").doc(String(a.pid)).collection("inbox")
    .onSnapshot(s=>{if(!s.empty)fbClaim(a)},e=>console.warn("Inbox listener:",e));
}
async function fbAttach(a){   // dipanggil tiap login
  fbUnwatch();
  const ok=await fbInit();
  if(!ok||acct!==a)return;
  if(!a.admin){
    try{await fbRegister(a)}catch(e){console.warn("Daftar profil gagal:",e);setMsg("☁️ Gagal daftar online: "+(e.code||e.message)+(String(e.code).indexOf("permission")>=0?" — cek Rules Firestore sudah di-Publish":""));return}
    if(acct!==a)return;
    fbWatch(a);
  }
  updateUserBar();
}
async function fbDeleteProfile(a){   // hapus akun: bersihkan juga data online (best effort)
  try{
    if(!await fbInit()||!FB.ok||!a||a.admin)return;
    const db=FB.db,pRef=db.collection("profiles").doc(String(a.pid));
    const inbox=await pRef.collection("inbox").get();
    if(!inbox.empty){const b=db.batch();inbox.docs.forEach(d=>b.delete(d.ref));await b.commit()}
    const b2=db.batch();b2.delete(pRef);b2.delete(db.collection("names").doc(nameKey(a.name)));await b2.commit();
  }catch(e){console.warn("Hapus profil online gagal:",e)}
}

/* ----- login harian: 7 hari berulang, streak putus kalau ada hari terlewat ----- */
function dailyState(){
  if(!acct)return null;
  if(acct.lastDaily===dateKey()){const s=acct.streak||1;return{claimed:true,streak:s,idx:(s-1)%7}}
  const cont=acct.lastDaily===yesterdayKey();
  const s=cont?(acct.streak||0)+1:1;
  return{claimed:false,streak:s,idx:(s-1)%7,broken:!cont&&!!acct.lastDaily};
}
function openDaily(){
  const st=dailyState();if(!st)return;
  let cells="";
  for(let i=0;i<7;i++){
    const done=i<st.idx||(st.claimed&&i===st.idx);
    cells+=`<div class="day ${done?"done":(i===st.idx?"today":"")}"><b>Hari ${i+1}</b>${DAILY_REWARD[i]/1000000} JT${done?"<br>✔":""}</div>`;
  }
  const reward=DAILY_REWARD[st.idx];
  const body=st.claimed
    ?`<p>Hadiah hari ini sudah diklaim. Kembali besok untuk <b>+${money(DAILY_REWARD[(st.idx+1)%7])} chip</b>.</p>
      <button class="btn small" type="button" style="font-size:16px" onclick="closeModal()">TUTUP</button>`
    :`<p>${st.broken?"Streak sempat terputus, mulai lagi dari hari 1. ":""}Login berturut-turut 🔥 <b>${st.streak} hari</b></p>
      <button class="btn spin" type="button" style="font-size:20px" onclick="claimDaily()">🎁 KLAIM +${money(reward)} CHIP</button>`;
  openModal(`<h2>🎁 LOGIN HARIAN</h2><div class="days">${cells}</div>${body}`);
}
function claimDaily(){
  const st=dailyState();if(!st||st.claimed)return;
  if(freeMode){exitFreeMode();if(freeMode)return}   // hadiah masuk ke chip asli
  const reward=DAILY_REWARD[st.idx];
  balance+=reward;acct.streak=st.streak;acct.lastDaily=dateKey();
  updateUserBar();updateUI();
  closeModal();
  setMsg(`Login harian hari ke-${st.idx+1}: +${money(reward)} chip`);
  try{burstCoins(false)}catch(e){}
}
function initAccount(){
  const id=LS.get("daf_guest_id");
  if(LS.get("daf_session")==="1"&&id){
    const a=loadAcct(id);
    if(a){applyAcct(a);afterLogin(a);return}
  }
  updateUserBar();openWelcome();
}
document.getElementById("loginBtn").addEventListener("click",loginGuest);
document.getElementById("adminBtn").addEventListener("click",openAdminLogin);
document.getElementById("freeExitBtn").addEventListener("click",exitFreeMode);
document.getElementById("dailyBtn").addEventListener("click",openDaily);
document.getElementById("profileBtn").addEventListener("click",openProfile);
document.getElementById("logoutBtn").addEventListener("click",logout);
window.addEventListener("beforeunload",saveGame);
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveGame()});
window.addEventListener("storage",e=>{   // chip masuk saat akun ini juga terbuka di tab lain
  if(acct&&!acct.admin&&e.key==="daf_inbox_"+acct.id){
    const n=claimInbox();
    if(n){setMsg("📥 Chip kiriman diterima");if(!modalOpen)openInfo("📥 CHIP MASUK",n,"closeModal()")}
  }
});
makeBoard=function(){seedResult("normal",true);render(false)}; // initial board
seedResult("normal",true);render(false);updateUI();renderFullTable();fbInit();initAccount();
