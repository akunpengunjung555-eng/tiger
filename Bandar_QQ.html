$('c0').classList.add('up');$('c1').classList.add('up');sfx('flip');await sleep(700);$('lr').textContent='MERAH '+(val(H.r)==9?'QIU':val(H.r));
await sleep(500);$('c2').classList.add('up');$('c3').classList.add('up');sfx('flip');await sleep(700);$('lb').textContent='BIRU '+(val(H.b)==9?'QIU':val(H.b));
await sleep(500);if(g==gen)settle(g)}
function dealerFin(){const d=$('dealer');d.classList.remove('fin');void d.getBoundingClientRect();d.classList.add('fin');setTimeout(()=>d.classList.remove('fin'),1000)}
async function settle(g){
const vr=val(H.r),vb=val(H.b),tm=twin(H.r),tb=twin(H.b);
const w=vr>vb?'m':vb>vr?'b':'t';
const six=tm&&tb,qq=vr==9&&vb==9,anyQ=vr==9||vb==9;
const res={m:w=='m'?2:w=='t'?1:0,b:w=='b'?2:w=='t'?1:0,t:w=='t'?9:0,q:qq?89:0,s:six?501:0,qm:vr==9?9:0,qb:vb==9?9:0,tm:tm?16:0,tb:tb?16:0};
let net=0,back=0;
for(const k in mine){const x=mine[k]*res[k];back+=x;net+=x-mine[k]}
win={};Object.keys(res).forEach(k=>{if(res[k]>1||(res[k]==1&&false))win[k]=1});if(w!='t')win[w]=1;
tr.push({w,q:anyQ,tw:tm||tb,tm,tb,vr,vb});draw();
showRes(w,tm,tb,qq,six);setTimeout(()=>react(Math.random()*5|0,['😮','😂','👍','😎','🔥'][Math.random()*5|0]),900);
say(six?'Six twins':qq?'Qiu qiu':w=='t'?'Seri':tm?'Twin merah':tb?'Twin biru':vr==9?'Qiu merah':vb==9?'Qiu biru':w=='m'?'Merah menang':'Biru menang');if(six||qq)setTimeout(()=>sfx('special'),600);else if(tm||tb||anyQ)setTimeout(()=>sfx('special'),600);
$('msg').textContent=(w=='t'?'SERI!':w=='m'?'MERAH menang!':'BIRU menang!');
await sleep(700);dealerFin();
const lose=Object.keys(pot).filter(k=>pot[k]&&!res[k]);
lose.forEach(k=>{for(let i=0;i<4;i++)setTimeout(()=>fly(zEl(k),dEl(),'#999',600),i*120)});
if(lose.length){sfx('chips');await sleep(900)}
const won=Object.keys(pot).filter(k=>pot[k]&&res[k]);
won.forEach(k=>{for(let i=0;i<4;i++)setTimeout(()=>{fly(dEl(),zEl(k),'#d4a017',600);if(mine[k]&&res[k]>1)setTimeout(()=>fly(zEl(k),aEl('me'),'#d4a017',600),650)},i*120)});
if(won.length){sfx('chips');await sleep(1900)}
if(SRV)coins=SRV.balance;else{coins+=back;if(HOST&&!HOST.server&&!HOST.inf)toHost({t:'qq-bal',balance:coins})}SRV=null;const hp=Object.keys(mine).reduce((a,k)=>res[k]>1?a+mine[k]*(res[k]-1):a,0),hit=hp>0,amt=Math.max(net,hp);if(net>0||hit){shower(amt>=2e7?40:22);if(qq||six)bigWin(six?'SIX TWINS!':'QIU QIU!',amt,six?'six':'qq');else floatText('+'+fmt(amt),'#7dffb0',$('coin'),22);try{navigator.vibrate&&navigator.vibrate([80,40,120])}catch(e){}sfx(six||amt>=1e9?'superwin':qq||amt>=5e8?'megawin':amt>=1e8?'bigwin':'win');setTimeout(()=>say('Kamu menang'),900)}else if(net<0){floatText('-'+fmt(-net),'#ff8a8a',$('coin'),22);sfx('lose');setTimeout(()=>say('Kamu kalah'),900)}
$('msg').textContent=(w=='t'?'SERI!':w=='m'?'MERAH menang!':'BIRU menang!')+(Object.keys(mine).length?(hit&&net<0?` Menang +${fmt(hp)} (bersih -${fmt(-net)})`:` Hasilmu: ${net>=0?'+':'-'}${fmt(Math.abs(net))}`):'');
if(!LIVE)bots.forEach(b=>b[1]+=Math.round((Math.random()-.45)*b[1]*.02));
pot={};phase='end';RESM=$('msg').textContent;if(ERRM){$('msg').textContent='⚠ '+ERRM+' — taruhan tidak dipotong';ERRM=''}draw();await sleep(1800);if(g==gen&&!LIVE)newRound()}

/* ===== MODE ONLINE / MABAR: ronde & kartu SAMA untuk semua pemain di room (server), taruhan 30 dtk, chat global.
   Hemat kuota gratis: poll tiap 3 dtk saat taruhan, sekali saat hasil, 6 dtk di luar itu. ===== */
let LIVE=false,curN=-1,shownN=-1,skew=0,lastPoll=0,polling=0,hbT=0,chSeq=0,chUnread=0,sbT=0,sbBusy=0,sbDirty=0,oth={},wantHist=1,lastSec=-1,lvTimer=0;
let RESM='',fSeq=-1;const GQ=[];let gBusy=0;
const QX={TWM:'TWIN KIRI',TWB:'TWIN KANAN',QQM:'QIU KIRI',QQB:'QIU KANAN',SERI:'SERI',MERAH:'MERAH MENANG',BIRU:'BIRU MENANG'};
function gText(e){const t=String(e.tier||'').split('|'),k=t[0].replace(/[^A-Z]/g,''),nm='<b>'+String(e.name||'?').replace(/[^A-Za-z0-9_]/g,'').slice(0,12)+'</b>';let l;
if(k=='SIX')l=`🎴 ${nm} SIX TWINS!`;else if(QX[k])l=`🎴 ${nm} ${QX[k]}!`;else if(k=='QQ')l=`🎴 ${nm} QIU QIU!`;else if(k=='WIN'||k=='LINE')l=`🏆 ${nm} MENANG BESAR`;else if(k=='FULL')l=`🖼️ ${nm} FULL GAMBAR`;else if(k=='SUPER'||k=='MEGA'||k=='BIG')l=`🏆 ${nm} ${k} WIN`;else l=`👑 ${nm} JACKPOT KARTU <b>${k.slice(0,6)}</b>`;
const col={SIX:'#7df9ff',QQ:'#ff7ad9',TWM:'#ff6b73',QQM:'#ff6b73',MERAH:'#ff6b73',TWB:'#6aa3ff',QQB:'#6aa3ff',BIRU:'#6aa3ff',SERI:'#4ade80',WIN:'#ffd34d',FULL:'#ff7a3d',SUPER:'#ff4d6d',MEGA:'#ffb02e',BIG:'#ffd34d',LINE:'#7dffa0',MINI:'#2fe36b',MINOR:'#29a8ff',MAJOR:'#d84dff',GRAND:'#ffd34d'}[k]||'#ffd34d';
return{col,html:`${l}<small>+${fmt(Number(e.amt)||0)} • ${t[2]=='Q'?'🎴 di Bandar QQ':t[2]=='1'?'🎁 di scatter mode':'di slot'}</small>`}}
function gShow(e){GQ.push(e);if(GQ.length>20)GQ.shift()}
function gFlush(){if(gBusy||!GQ.length)return;gBusy=1;const e=GQ.shift(),p=gText(e),el=$('gan');el.firstChild.style.setProperty('--c',p.col);el.firstChild.innerHTML=p.html;requestAnimationFrame(()=>el.classList.add('on'));sfx('special');setTimeout(()=>{el.classList.remove('on');setTimeout(()=>{gBusy=0},400)},4200)}
const QB=30000,QC=45000,QK=['m','b','t','q','s','qm','qb','tm','tb'],chSeen=new Set();
const api=(path,body)=>hostCall({t:'qq-api',path,body});
const eqm=(a,b)=>QK.every(k=>(a[k]||0)===(b[k]||0));
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const seatOf=n=>{const h=hue(n);return[n,0,`hsl(${h} 45% 70%)`,`hsl(${(h+40)%360} 15% 15%)`,`hsl(${(h+180)%360} 35% 35%)`]};
const EMPTY=()=>['—',0,'#5a4a6a','#222','#333',1];
const trOf=h=>{const vr=val(h.r),vb=val(h.b);return{w:vr>vb?'m':vb>vr?'b':'t',q:vr==9||vb==9,tw:twin(h.r)||twin(h.b),tm:twin(h.r),tb:twin(h.b),vr,vb}};
function liveStart(){LIVE=true;bots.length=0;for(let i=0;i<5;i++)bots.push(EMPTY());$('gift').style.display='none';$('chb').style.display='';ROOMS.forEach(r=>r[2]=0);phase='wait';$('msg').textContent='Menghubungkan ke meja...';draw();lvTimer=setInterval(liveTick,250);poll()}
async function poll(){if(polling)return;polling=1;lastPoll=Date.now();const hb=Date.now()-hbT>12000;if(hb)hbT=Date.now();
const r=await api('/qq/state',{room:roomI,since:chSeq,fs:fSeq,hb:hb?1:0,h:wantHist});polling=0;
if(r.ok&&r.j&&r.j.n!==undefined){if(r.j.room===roomI)onState(r.j)}else if(phase!='deal')$('msg').textContent='⚠ '+((r.j&&r.j.error)||'Server tidak merespons')+' (mencoba lagi...)'}
function onState(s){skew=s.t-Date.now();
(s.rooms||[]).forEach((c,i)=>{if(ROOMS[i])ROOMS[i][2]=c});$('onl').textContent=s.onl||1;
bots.length=0;(s.seats||[]).slice(0,5).forEach(x=>{const a=seatOf(x.name);a[1]=x.bal;bots.push(a)});while(bots.length<5)bots.push(EMPTY());
(s.chat||[]).forEach(addChat);if(s.feed){if(fSeq>=0)(s.feed.items||[]).forEach(gShow);fSeq=s.feed.last}if(typeof s.clast==='number')chSeq=s.clast;
if(s.hist){tr=s.hist.map(trOf);wantHist=0}
if(!s.hands){if(curN!==s.n)liveRound(s);else mergePot(s);return}
if(shownN===s.n)return;shownN=s.n;
if(curN===s.n||Object.keys(s.mine||{}).length){curN=s.n;mine={...s.mine};pot=s.pot||{};go(gen,s)}
else{phase='wait';$('msg').textContent='Ronde sedang berjalan... tunggu ronde berikutnya.';draw()}}
function liveRound(s){gen++;RESM='';curN=s.n;if(SS)speechSynthesis.cancel();phase='bet';vt=0;mine={...s.mine};win={};H=null;oth={};pot={};
for(const k of QK){oth[k]=(s.pot[k]||0)-(mine[k]||0);pot[k]=s.pot[k]||0}coins=s.balance;
$('hr').innerHTML=$('hbl').innerHTML='';$('lr').textContent='MERAH';$('lb').textContent='BIRU';
if(auto&&last&&!Object.keys(mine).length)betDo(()=>({...last}));
$('msg').textContent='Pasang taruhan! Tap zona untuk menaruh chip.';lastSec=-1;sfx('start');setTimeout(()=>say('Silakan pasang taruhan'),300);draw()}
function mergePot(s){const sm=s.mine||{},np={},idle=!bqBusy&&!pendFns.length;let c=0;
for(const k of QK){const o=(s.pot[k]||0)-(sm[k]||0);
if(o>(oth[k]||0)&&phase=='bet'&&c++<3){const ix=bots.map((b,i)=>b[5]?-1:i).filter(i=>i>=0);if(ix.length)place(k,ix[Math.random()*ix.length|0],CH[1+(Math.random()*5|0)][2])}
oth[k]=o;np[k]=o+(idle?(sm[k]||0):(mine[k]||0))}
pot=np;if(idle){mine={...sm};coins=s.balance}draw()}
function liveTick(){if(!LIVE)return;gFlush();
const sn=Date.now()+skew,n=Math.floor(sn/QC),st=n*QC,left=st+QB-sn,sec=Math.max(0,Math.ceil(left/1000)),age=Date.now()-lastPoll;
if(left>0){$('tm').textContent=sec;$('tm').classList.toggle('urgent',sec<=5&&sec>0);
if(phase=='bet'&&sec!==lastSec){lastSec=sec;if(sec<=5&&sec>0)sfx('warn',sec);if(sec==3)say('Waktu hampir habis')}
if(curN!==n?age>500:age>3000)poll()}
else{if(phase=='bet'){phase='lock';sfx('end');$('msg').textContent='Taruhan ditutup. Membuka kartu...';draw()}
$('tm').classList.remove('urgent');$('tm').textContent=phase=='wait'?Math.ceil((st+QC-sn)/1000):0;
if(phase=='wait'||phase=='end'){const ns=Math.max(0,Math.ceil((st+QC-sn)/1000));if(phase=='end')$('tm').textContent=ns;$('msg').textContent=(phase=='end'&&RESM?RESM+' • ':'')+(+$('onl').textContent<=1?'Menunggu pemain lain… ronde berikutnya ':'Menunggu ronde berikutnya… ')+ns+' dtk'}
if(phase=='lock'?(age>1200&&left<-250):age>6000)poll()}}
/* TARUHAN: chip baru muncul & koin baru berkurang SETELAH server mengonfirmasi. Tampilan selalu mengikuti data server. */
let bqBusy=0,pendFns=[];
function betDo(fn){pendFns.push(fn);if(!bqBusy)betFlush()}
async function betFlush(){if(bqBusy)return;bqBusy=1;
while(pendFns.length){const fns=pendFns.splice(0),n=curN;let t={...mine};for(const f of fns)t=f(t);for(const k of Object.keys(t))if(!(t[k]>0))delete t[k];
if(eqm(t,mine))continue;
$('msg').textContent='⏳ Mengirim taruhan...';
const r=await api('/qq/bet',{room:roomI,n,bets:t});
if(n!==curN||!LIVE){pendFns.length=0;break}
const j=r.j||{},old=mine;
if(r.ok){mine={...j.mine};if(typeof j.balance==='number')coins=j.balance;
for(const k of QK){pot[k]=(oth[k]||0)+(mine[k]||0);if((mine[k]||0)>(old[k]||0))place(k,'me','#d4a017')}
if(phase=='bet')$('msg').textContent='Pasang taruhan! Tap zona untuk menaruh chip.'}
else{if(j.mine){mine={...j.mine};for(const k of QK)pot[k]=(oth[k]||0)+(mine[k]||0)}if(typeof j.balance==='number')coins=j.balance;
pendFns.length=0;$('msg').textContent='⚠ '+(r.status===0?'Koneksi bermasalah':(j.error||'Gagal'))+' - taruhan TIDAK masuk';if(r.status===0){lastPoll=0}}
draw()}
bqBusy=0}
function addChat(m){if(chSeen.has(m.seq))return;chSeen.add(m.seq);const d=document.createElement('div'),b=document.createElement('b');b.textContent=m.name+': ';d.appendChild(b);d.appendChild(document.createTextNode(m.msg));const l=$('cpl');l.appendChild(d);while(l.children.length>60)l.removeChild(l.firstChild);l.scrollTop=l.scrollHeight;
if($('cp').style.display!='flex'){chUnread++;$('chd').style.display=''}}
function sysChat(t){const d=document.createElement('div');d.className='sy';d.textContent=t;$('cpl').appendChild(d);$('cpl').scrollTop=1e9}
async function sendChat(){const i=$('ci'),v=i.value.trim();if(!v)return;i.value='';const r=await api('/qq/chat',{msg:v});if(!r.ok)sysChat((r.j&&r.j.error)||'Gagal mengirim');else{lastPoll=0;poll()}}
$('chb').onclick=e=>{e.stopPropagation();$('cp').style.display='flex';chUnread=0;$('chd').style.display='none';$('cpl').scrollTop=1e9;$('menu').style.display='none'};
$('cx').onclick=()=>{$('cp').style.display='none'};$('cs').onclick=sendChat;$('ci').onkeydown=e=>{if(e.key==='Enter')sendChat()};
$('cp').onclick=e=>e.stopPropagation();
if(IN_FRAME){toHost({t:'qq-ready'});setTimeout(()=>{if(!_started){_started=true;HOST={server:false,inf:false};coins=1e9;newRound()}},2500)}else newRound();
