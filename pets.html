<style>

.empty{padding:26px 10px;text-align:center;color:#ffd978}

.fence{position:absolute;left:0;right:0;top:70px;height:34px;background:repeating-linear-gradient(90deg,#8a5a2b 0 8px,transparent 8px 26px);border-top:5px solid #a8713a;border-bottom:5px solid #a8713a}
.pet{position:absolute;left:0;top:0;width:52px;height:52px;cursor:pointer;will-change:transform}
.pet:after{content:'';position:absolute;left:6px;right:6px;bottom:-4px;height:8px;border-radius:50%;background:#0003;z-index:-1}
.fl{transform-origin:50% 100%}
.sp{width:52px;height:52px;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%}
.pet .em{font-size:44px;line-height:1}
.pet .ph{width:50px;height:50px}
.pet.mv .sp{animation:hop .38s infinite}

.pet.L .sp{filter:drop-shadow(0 0 8px #ffd34d)}
.pet.R .sp{filter:drop-shadow(0 0 6px #d84dff)}
.bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;font-weight:700}
.bub:empty{display:none}
.bub.coin{background:#ffd34d;color:#4a2300;border-radius:10px;padding:2px 8px;animation:bob 1s infinite alternate;cursor:pointer}
@keyframes bob{to{transform:translate(-50%,-4px)}}
#bowl{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:32px;cursor:pointer;text-align:center;line-height:1;z-index:500}
#bowl small{display:block;font-size:11px;font-weight:700;background:#21030a;border-radius:6px;padding:1px 6px;color:#ffd978}
.fx{position:absolute;font-size:20px;pointer-events:none;animation:up .9s forwards;z-index:999}

#yard{height:340px;background:#8fd3ff}

.hint{position:absolute;left:8px;top:6px;font-size:11px;background:#21030acc;border-radius:6px;padding:2px 6px;z-index:5;pointer-events:none}

.card.M{animation:glowM 1.2s infinite alternate}
@keyframes glowM{to{box-shadow:0 0 22px #ff4d6dcc,inset 0 0 18px #ff4d6d60}}
.gm{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}
.gb{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 10px;border:2px solid var(--gold);border-radius:12px;background:linear-gradient(#b3203f,#4a0612);color:#fff9df;font-weight:800;font-size:13px;line-height:1.15;text-align:left;cursor:pointer;box-shadow:inset 0 0 12px #ffd34d30}
.gb.qq{border-color:#38d481;background:linear-gradient(#0f5132,#052e1a)}

.net{font-size:12px;margin:0 0 8px;color:#ffd978}.net.bad{color:#ff9b9b}.net a{color:var(--gold);font-weight:700}
#yard{isolation:isolate}

#hunt[hidden]{display:none}
.hh{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:2px solid var(--g2);background:#2a050c}

.hx{width:40px;height:40px;flex:none;border-radius:10px;border:2px solid var(--gold);background:#430713;color:#fff;font-size:20px;font-weight:700;cursor:pointer}
#hPick{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;align-content:start;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
#hPick[hidden]{display:none}
#hFrame{flex:1;width:100%;border:0;background:#190208}#hFrame[hidden]{display:none}
.hc{display:flex;align-items:center;gap:12px;padding:12px;border:3px solid var(--bc,#ffd34d);border-radius:14px;background:linear-gradient(var(--c1),var(--c2));color:#fff9df;text-align:left;cursor:pointer;box-shadow:inset 0 0 16px #ffffff18}
.hc i{font-style:normal;font-size:44px}.hc b{display:block;font-size:15px}.hc small{display:block;font-size:12px;margin-top:2px}.hc em{margin-left:auto;font-style:normal;font-weight:800;color:var(--bc,#ffd34d)}
.hc:active{transform:translateY(1px)}
#hLoad{position:fixed;inset:0;z-index:1200;display:flex;opacity:0;visibility:hidden;transition:opacity .26s ease,visibility 0s .26s;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;background:radial-gradient(circle at 50% 30%,#8d1021,#2a050c 70%)}
#hLoad.on{opacity:1;visibility:visible;transition:opacity .22s ease}#hLoad b{color:var(--gold);font-size:18px;letter-spacing:1px}
.hl{font-size:64px;animation:hbounce .8s infinite alternate}
@keyframes hbounce{to{transform:translateY(-10px) scale(1.08)}}
.hb{width:min(260px,70%);height:10px;border:1px solid var(--g2);border-radius:8px;background:#24030a;overflow:hidden}
.hb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc238,#fff27d)}
.hb.go i{animation:hfill 4s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes hfill{to{width:92%}}
@media(prefers-reduced-motion:reduce){.hl{animation:none}}
.hunt{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;margin-bottom:8px;padding:8px 12px;border:2px solid var(--gold);border-radius:12px;background:linear-gradient(#ffc238,#df6d07);color:#fff;font-weight:800;font-size:15px;text-align:left;text-shadow:0 1px #6d2b00;cursor:pointer;box-shadow:inset 0 0 12px #fff3,0 3px 0 #551400}
.hunt i{font-style:normal;font-size:28px}.hunt small{display:block;font-size:11px;font-weight:600;color:#fff4c8}.hunt em{margin-left:auto;font-style:normal;font-size:22px}
.hunt:active{transform:translateY(2px)}
/* ===== TEMA BARU ===== */
html,body{background:radial-gradient(120% 70% at 50% -10%,#c22a4a 0,#6a0c1f 38%,#1d0309 100%) fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;background-image:radial-gradient(#ffd34d33 1px,transparent 1.5px),radial-gradient(#ffffff22 1px,transparent 1.5px);background-size:46px 46px,29px 29px;background-position:0 0,13px 17px}

nav{gap:6px;padding:5px;border-radius:16px;background:#2a050ccc;border:2px solid #ffffff14}

.card{position:relative;overflow:hidden;border-radius:16px;border:2px solid var(--rc,#d98a1b);background:linear-gradient(160deg,#7a1124,#3a0610 62%);box-shadow:0 6px 16px #0006,inset 0 0 18px #ffffff10}

.ph{width:72px;height:72px;border-radius:14px;border:3px solid var(--rc,#d98a1b);box-shadow:0 0 0 2px #0006,0 0 14px #ffffff30;background:#190208}
.em{font-size:56px}
.row{gap:10px}

.bar{height:10px;border-radius:8px;background:#1a0207;box-shadow:inset 0 1px 3px #000a}

.b{border-radius:11px;border-color:#ffd34d99;background:linear-gradient(#8f1a30,#4a0916);box-shadow:inset 0 1px #fff3,0 3px 0 #2a0408;transition:transform .08s}
.b:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px #fff3,0 1px 0 #2a0408}
.b.go{background:linear-gradient(#3dee7a,#0c7a35);box-shadow:inset 0 1px #fff6,0 3px 0 #04361a}

h2{display:flex;align-items:center;gap:8px;font-size:15px;color:#ffe36a;margin:16px 0 8px;text-shadow:0 1px #3a0a00}

.col{display:inline-block;line-height:0}.col .ph{width:50px;height:50px;border-radius:12px}.col.lock{filter:grayscale(1) brightness(.35)}

.hc{border-radius:16px;box-shadow:0 6px 16px #0007,inset 0 0 16px #ffffff18}

@keyframes hin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

#hFrame:not([hidden]){animation:hin .4s ease both}

<script>
/* ===== INTEGRASI KE GAME UTAMA =====
   Ganti ADAPTER ini agar memakai chip game utama (dan server Cloudflare kamu).
   Contoh: get:()=>acct.chips, add:d=>{acct.chips+=d; syncServer()} */
const API_URL="https://daf-api.akunpengunjung555.workers.dev";
function tokUid(t){try{const p=t.split('.')[0].replace(/-/g,'+').replace(/_/g,'/');return String(JSON.parse(atob(p+'='.repeat((4-p.length%4)%4))).id||'')}catch(e){return ''}}
const NET={tok:null,uid:'',on:false,ready:false,dead:false,bal:0,pend:0,busy:false,name:''};
try{if(localStorage.getItem('daf_session')==='1')NET.tok=localStorage.getItem('daf_token')||null}catch(e){}
if(NET.tok){NET.uid=tokUid(NET.tok);NET.on=!!NET.uid}
const KEY='dafpets2'+(NET.on?'_'+NET.uid:'');
/* Login di DAF Arena -> chip Pets = saldo akun server yang sama dengan game lain (pending dikirim tiap 4 dtk).
   Belum login -> chip lokal di perangkat ini. */
const ADAPTER={get:()=>NET.on?(NET.dead?0:NET.bal+NET.pend):S.chips,add:d=>{if(!NET.on)S.chips+=d;else if(!NET.dead)NET.pend+=d}};
const HOST=window.parent!==window;
function toP(m){try{parent.postMessage(m,location.origin==='null'?'*':location.origin)}catch(e){}}
async function netApi(path,body,ka){const c=new AbortController(),m=setTimeout(()=>c.abort(),12000);try{const r=await fetch(API_URL+path,{method:'POST',signal:c.signal,keepalive:!!ka,headers:{'Content-Type':'application/json',Authorization:'Bearer '+NET.tok},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,j}}catch(e){return{ok:false,status:0,j:{}}}finally{clearTimeout(m)}}
function snap(){const o=Object.assign({},S);delete o.chips;return o}
function setNet(msg){const e=$('#net');if(!e)return;
 if(!NET.on){e.className='net';e.innerHTML='Belum login: chip Pets hanya tersimpan di perangkat ini. <a href="index.html">Login di DAF Arena</a>'}
 else if(NET.dead){e.className='net bad';e.innerHTML='Sesi habis. <a href="index.html">Login ulang di DAF Arena</a>'}
 else if(msg){e.className='net bad';e.textContent=msg}
 else{e.className='net';e.textContent='☁️ '+(NET.ready?'Chip sama dengan game lain'+(NET.name?' · '+NET.name:''):'Menyambung ke akun…')}}
function netDead(){NET.dead=true;setNet();R()}
async function netSync(ka){
 if(!NET.on||!NET.ready||NET.dead||NET.busy)return;
 NET.busy=true;const send=Math.trunc(NET.pend);
 const r=await netApi('/pets/sync',{state:snap(),d:send},ka);
 NET.busy=false;
 if(r.status===401){netDead();return}
 if(r.ok&&typeof r.j.balance==='number'){NET.pend-=send;NET.bal=r.j.balance;if(HOST)toP({t:'pets-bal',balance:r.j.balance});if(r.j.capped)toast('Hasil chip Pets dibatasi server');return}
 if(r.status===400&&typeof r.j.balance==='number'){NET.bal=r.j.balance;NET.pend=0;toast('Saldo disesuaikan dengan server')}}
async function netBoot(){
 if(!NET.on)return;
 for(let i=0;i<4&&!NET.ready;i++){
  const r=await netApi('/pets/load');
  if(r.status===401){netDead();return}
  if(r.ok&&typeof r.j.balance==='number'){
   NET.bal=r.j.balance;NET.name=r.j.name||'';
   if(r.j.state&&r.j.state.pets){load(r.j.state);save()}
   NET.ready=true;setNet();R();netSync();return}
  await new Promise(z=>setTimeout(z,2500))}
 setNet('Server tidak terjangkau, muat ulang halaman')}
const sleep=ms=>new Promise(z=>setTimeout(z,ms));
async function netFlush(){const t=Date.now();while(NET.busy&&Date.now()-t<3000)await sleep(100);await Promise.race([netSync(),sleep(3000)])}
/* ===== TEMPAT BERBURU CHIP: frame berisi game lain (index.html?embed=1), lengkap dengan layar loading ===== */
const GM=[{id:'daf',e:'🐉',img:EMBED_PHOTO['🐉'],n:'Dragon Animal Fortune',s:'Slot • solo & mabar',c:'#b3203f',d:'#4a0612',b:'#ffd34d'},{id:'qq',e:'🎴',n:'Bandar QQ',s:'Domino • merah vs biru',c:'#0f5132',d:'#052e1a',b:'#38d481'}];
const HTIPS=['Chip Pets dan chip game sama, satu saldo akun.','Atur bet sesuai chip, mainkan dengan bijak.','Tombol ← di kiri atas membawamu kembali.','Hewanmu tetap bekerja selama halaman ini terbuka.'];
const TABM={kandang:['🏡','Kandang'],toko:['🛒','Toko'],lelang:['🔨','Lelang'],hadiah:['🎁','Misi & Hadiah']};
let XB=0;
async function xSwap(ic,tt,sub,fn,min){if(XB)return;XB=1;try{hLoad(true,sub,ic,tt);await sleep(280);try{await fn()}catch(e){}await sleep(min||500)}finally{hLoad(false);XB=0}}
const H={open:false,game:null};
function hLoad(on,sub,ic,tt){const l=$('#hLoad'),b=$('#hBar');l.classList.toggle('on',!!on);b.classList.remove('go');if(on){$('#hIc').textContent=ic||'🎯';$('#hTt').textContent=(tt||'Tempat Berburu Chip').toUpperCase();$('#hSub').textContent=sub||'Memuat…';$('#hTip').textContent=rnd(HTIPS);void b.offsetWidth;b.classList.add('go')}}
function hPick(){const f=$('#hFrame');f.onload=null;f.src='about:blank';f.hidden=true;H.game=null;$('#hGame').textContent='Pilih game';
 const p=$('#hPick');p.hidden=false;p.innerHTML='<div class="hhero"><b>🎯 CARI CHIP, BAWA PULANG</b><small>Menang di game, chip langsung masuk ke saldo Pets</small></div>'+GM.map((g,i)=>`<button class="hc" data-hg="${g.id}" style="--c1:${g.c};--c2:${g.d};--bc:${g.b};--n:${i}"><i class="hi">${g.img?`<img src="${g.img}" alt="">`:g.e}</i><span class="ht"><b>${g.n}</b><small>${g.s}</small><u class="go">MAIN SEKARANG ›</u></span></button>`).join('')+'<div class="hnote">Tombol ← di kiri atas membawamu kembali ke kandang</div>'}
function huntOpen(){if(H.open||XB)return;xSwap('🎯','Tempat Berburu Chip','Membuka tempat berburu…',async()=>{H.open=true;bgmStop();$('#hunt').hidden=false;document.body.style.overflow='hidden';hPick();await netFlush()},650)}
async function huntPlay(id){if(H.game)return;const g=GM.find(x=>x.id===id);if(!g)return;H.game=id;
 hLoad(true,'Memuat '+g.n+'…',g.e,g.n);await netFlush();if(H.game!==id)return;
 const f=$('#hFrame'),t0=Date.now();
 await new Promise(res=>{let d=0;const go=()=>{if(!d){d=1;res()}};f.onload=go;setTimeout(go,12000);f.src='index.html?g='+id+'&embed=1'});
 await sleep(Math.max(0,900-(Date.now()-t0)));if(H.game!==id)return;
 $('#hPick').hidden=true;f.hidden=false;$('#hGame').textContent=g.e+' '+g.n;hLoad(false)}
function huntBack(){if(XB)return;if(H.game){xSwap('🎯','Tempat Berburu Chip','Kembali ke daftar game…',async()=>{hPick();await netFlush()},600)}else{xSwap('🐾','DAF Pets','Kembali ke kandang…',async()=>{$('#hunt').hidden=true;H.open=false;document.body.style.overflow='';bgmStart();await netFlush();R()},650)}}
document.addEventListener('click',e=>{const lg=e.target.closest('a[href="index.html"]');if(lg&&HOST){e.preventDefault();return toP({t:'pets-login'})}if(e.target.closest('#huntBtn'))return HOST?toP({t:'pets-hunt'}):huntOpen();if(e.target.closest('#hBack'))return huntBack();const g=e.target.closest('[data-hg]');if(g)huntPlay(g.dataset.hg)});
addEventListener('message',e=>{const f=$('#hFrame');if(e.origin===location.origin&&e.data&&e.data.t==='pets-exit'&&f&&e.source===f.contentWindow)huntBack()});
addEventListener('message',e=>{if(!HOST||e.source!==parent)return;const t=e.data&&e.data.t;if(t==='pets-flush'){ACT=false;bgmStop();save();netSync(true)}else if(t==='pets-resume'){ACT=true;bgmStart();netSync();R()}});
addEventListener('storage',e=>{if(e.key==='daf_session'||e.key==='daf_token')location.reload()});
/* ===== BACKSOUND & SUARA PETS (engine bersama: daf-sfx.js; musik dibuat WebAudio, tanpa file) =====
   Mau pakai lagu sendiri? isi BGM_URL dengan alamat file mp3 satu folder, mis. 'musik.mp3' */
const SND=window.DAFSound||{ui(){},pet(){},step(){},bgm(){},bgmStop(){},unlock(){},autoBind(){},isBgm:()=>false,setBgm(){},toggleBgm:()=>false,onChange(){}};
const BGM_URL='',BGM={a:null,t:0};
let ACT=true;   /* false = layar Pets sedang disembunyikan lobi (daftar game / di dalam game): musik & langkah kaki Pets harus diam */
const bgmWant=()=>ACT&&!H.open&&!document.hidden;
function bgmStart(){if(!SND.isBgm()||!bgmWant())return;
 if(BGM_URL){if(!BGM.a){BGM.a=new Audio(BGM_URL);BGM.a.loop=true;BGM.a.volume=.5}BGM.a.play().then(()=>{BGM.t=1}).catch(()=>{});return}
 SND.bgm('main')}
function bgmStop(){if(BGM.a){BGM.a.pause();BGM.t=0}SND.bgmStop()}
function bgmUI(){const b=$('#bgmBtn');if(b){const on=SND.isBgm();b.textContent=on?'🔊':'🔇';b.style.opacity=on?1:.6}}
SND.autoBind({skip:el=>el.id==='bgmBtn'});
SND.onChange(()=>{bgmUI();SND.isBgm()?bgmStart():bgmStop()});   /* sinkron dengan tombol musik di lobi/frame lain */
document.addEventListener('click',e=>{if(e.target.closest('#bgmBtn')){const on=SND.toggleBgm();bgmUI();on?bgmStart():bgmStop();SND.ui(on?'on':'off');return}bgmStart()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgmStop();else bgmStart()});
setInterval(()=>{if(H.open)$('#hChips').textContent=fmt(ADAPTER.get())},1000);

document.addEventListener('visibilitychange',()=>{if(document.hidden){save();netSync(true)}else netSync()});
addEventListener('pagehide',()=>{save();netSync(true)});
addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
setInterval(()=>netSync(),4000);

/* 8 hewan sama persis dengan slot DAF (urutan = makin langka, sesuai bobot w di daf.js) */
